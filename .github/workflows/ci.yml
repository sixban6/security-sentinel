name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-cross-build:
    name: Go Test & Multi-Arch Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit & headless GPU UI tests
        run: go test -v ./...

      - name: Verify zero-CGO cross-compilation (Linux / macOS / Windows / OpenWrt)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/sectl-linux-amd64 ./cmd/sectl
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/sectl-linux-arm64 ./cmd/sectl
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags="-s -w" -o /tmp/sectl-openwrt-mipsle ./cmd/sectl
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/sectl-darwin-arm64 ./cmd/sectl
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/sectl-windows-amd64.exe ./cmd/sectl
